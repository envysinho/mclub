services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_db
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports:
      - "5434:5432"
    volumes:
      - gym_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles:
      - backend
    build:
      context: ./backend
    container_name: gym-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/gym_db
      DB_USER: gym
      DB_PASSWORD: gym
      JWT_SECRET: change-this-secret-before-production-min-256-bits
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
    ports:
      - "8082:8082"

volumes:
  gym_postgres_data:
