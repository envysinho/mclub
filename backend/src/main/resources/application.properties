server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/gym_db}
spring.datasource.username=${DB_USER:gym}
spring.datasource.password=${DB_PASSWORD:gym}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5174,http://localhost:5174}
app.jwt.secret=${JWT_SECRET:gym-dev-jwt-secret-key-min-256-bits-long!!}
app.jwt.expiration-ms=86400000
